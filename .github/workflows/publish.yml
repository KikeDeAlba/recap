name: publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: the tag and the manifest have to agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(jq -r .version package.json)"
          if [ "$tag" != "$manifest" ]; then
            echo "the release is $tag and package.json says $manifest" >&2
            exit 1
          fi

      - run: pnpm typecheck

      - run: pnpm test

      - name: install the tarball the way a person would, and run it
        run: |
          tarball="$(npm pack --pack-destination "$RUNNER_TEMP" --silent | tail -1)"
          npm install -g --prefix "$RUNNER_TEMP/prefix" "$RUNNER_TEMP/$tarball"
          "$RUNNER_TEMP/prefix/bin/recap" capabilities --json
          test -f "$RUNNER_TEMP/prefix/lib/node_modules/@kikedealba/recap/Resources/summary-prompt.md"
          test -f "$RUNNER_TEMP/prefix/lib/node_modules/@kikedealba/recap/skills/recap/SKILL.md"

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  loopback:
    runs-on: windows-latest
    permissions:
      contents: write

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: the tag and the manifest have to agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(jq -r .version package.json)"
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' native/loopback/Cargo.toml | head -1)"
          if [ "$tag" != "$manifest" ] || [ "$tag" != "$crate" ]; then
            echo "the release is $tag, package.json says $manifest and Cargo.toml says $crate" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/loopback

      - run: cargo build --release --locked
        working-directory: native/loopback

      - name: pack the zip and its checksum
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset="recap-loopback-${version}-windows-x64.zip"
          mkdir -p dist
          cp native/loopback/target/release/recap-loopback.exe dist/
          (cd dist && 7z a -tzip "$asset" recap-loopback.exe)
          (cd dist && sha256sum "$asset" > "$asset.sha256")
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: attach them to the release
        run: gh release upload "$GITHUB_REF_NAME" "dist/$ASSET" "dist/$ASSET.sha256" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
